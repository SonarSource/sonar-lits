name: Unified Dogfooding scans

# Onboard the project key below on Cloud EU and Cloud US through SPEED, and
# grant access to the IRIS Vault secret and Artifactory private-reader preset.

on:
  schedule:
    - cron: '0 4 * * *' # Run every day at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unified-platform-dogfooding:
    runs-on: github-ubuntu-latest-s
    name: Unified Platform Dogfooding
    permissions:
      id-token: write
      contents: write # Required by build-maven's build-number management
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.7.7
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          run-shadow-scans: true
          artifactory-reader-role: private-reader
          maven-args: -Pcoverage -Dsonar.organization=sonarsource
      - name: Run IRIS Analysis
        if: github.ref_name == github.event.repository.default_branch
        uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: org.sonarsource.sonar-lits-plugin:lits
          primary_platform: Next
          shadow1_project_key: org.sonarsource.sonar-lits-plugin:lits
          shadow1_platform: SQC-EU
          shadow2_project_key: org.sonarsource.sonar-lits-plugin:lits
          shadow2_platform: SQC-US
