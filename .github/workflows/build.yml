name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # nightly build at 1AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s  # Public repo - uses github-ubuntu-latest-s
    name: Build
    outputs:
      build-number: ${{ steps.build.outputs.BUILD_NUMBER }}
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.7.7
      - uses: SonarSource/ci-github-actions/build-maven@v2
        id: build
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: none
          maven-args: -Pcoverage
      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

  analysis:
    name: NEXT analysis
    needs: build
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.7.7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          sonar-platform: next
          artifactory-reader-role: private-reader

  plugin_qa:
    needs: [ build ]
    runs-on: github-ubuntu-latest-s  # Public repo - uses github-ubuntu-latest-s
    name: Plugin QA
    permissions:
      id-token: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        sq_version: [LATEST_RELEASE, DEV]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.7.7
      - uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - name: Run Plugin QA Tests
        working-directory: its/plugin
        env:
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          SONARSOURCE_REPOSITORY_URL: https://repox.jfrog.io/artifactory/sonarsource-qa
          SONARSOURCE_QA: true
        run: |
          mvn test -DjavaVersion="LATEST_RELEASE" -Dsonar.runtimeVersion=${{ matrix.sq_version }} -Dmaven.test.redirectTestOutputToFile=false -B -e -V
      - name: Generate test report on failure
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: failure()
        with:
          name: Plugin QA Test Report (${{ matrix.sq_version }})
          reporter: java-junit
          path: its/plugin/**/target/surefire-reports/TEST-*.xml
          list-suites: "failed"
          list-tests: "failed"

  promote:
    needs: [ plugin_qa, analysis ]
    runs-on: github-ubuntu-latest-s  # Public repo - uses github-ubuntu-latest-s
    name: Promote
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    needs: [ build, plugin_qa, analysis, promote ]
    if: >-
      always()
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s  # Public repo - uses github-ubuntu-latest-s
    name: Notify build failure
    permissions:
      actions: read      # lets the action list this run's own jobs via the GitHub API
      id-token: write     # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch || 'master') }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
